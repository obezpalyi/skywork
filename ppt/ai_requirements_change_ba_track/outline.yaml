- page_num: 1
  heading: ШІ-підтримка управління вимогами та змінами в SDLC — Трек для бізнес-аналітиків
  type: title
  des: Титульна сторінка навчального курсу, присвяченого трансформації неструктурованих даних у контрольовані пакети вимог за допомогою ШІ.
- page_num: 2
  heading: Чому цей трек важливий для сучасного аналітика
  type: content
  des: 'Огляд викликів BA: розрізнені джерела, неповні запити на зміни та ризики слабкої простежуваності вимог у Jira.'
- page_num: 3
  heading: Навчальний маршрут та ключові результати курсу
  type: content
  des: Огляд чотирьох навчальних сесій та перелік фінальних артефактів, включаючи матрицю простежуваності та персональний AI Playbook.
- page_num: 4
  heading: 'Сесія BA-1: Цілі та вхідні матеріали ServiceHub'
  type: content
  des: 'Визначення бізнес-контексту та робота з джерелами: протоколами зустрічей, SLA, електронними листами та фрагментами специфікацій.'
- page_num: 5
  heading: Вибір правильної дії ШІ в інструменті Xplore
  type: content
  des: Роль Xplore як практичного інструменту для Q&A, сумаризації, порівняння та трансформації вимог при збереженні людського контролю.
- page_num: 6
  heading: Структура багаторазового промпту для бізнес-аналітика
  type: content
  des: 'Опис п''яти елементів ефективного промпту: роль, контекст, дія, формат виводу та критерії якості.'
- page_num: 7
  heading: 'Робочий процес BA-1: Від джерел до пакету вимог'
  type: content
  des: Покроковий алгоритм витягування вимог, класифікації функціональних і нефункціональних аспектів та виявлення суперечностей.
- page_num: 8
  heading: 'Демонстрація на прикладі ServiceHub: Робота з конфліктами'
  type: content
  des: Практичний кейс вирішення суперечностей щодо часу реагування SLA між різними документами та повідомленнями замовника.
- page_num: 9
  heading: Практика та результати першої сесії
  type: content
  des: Створення пакету вимог, реєстру уточнювальних запитань та перших шаблонів промптів для аналітика.
- page_num: 10
  heading: 'Сесія BA-2: Якість вимог та завдання в Jira'
  type: content
  des: Перевірка здоров'я вимог, покращення критеріїв приймання та трансформація вимог у готові до розробки завдання.
- page_num: 11
  heading: Модель оцінки якості вимог для аналітика
  type: content
  des: 'Огляд шести вимірів якості: повнота, несуперечливість, чіткість, тестованість, здійсненність та простежуваність.'
- page_num: 12
  heading: Процес перевірки якості за допомогою Xplore
  type: content
  des: Використання ШІ для пошуку дублікатів, неоднозначностей та пропущених сценаріїв з подальшою валідацією людиною.
- page_num: 13
  heading: 'Робочий процес BA-2: Від вимоги до завдання в беклозі'
  type: content
  des: Створення User Stories, визначення меж (scope), додавання бізнес-правил та перевірка на відповідність Definition of Ready.
- page_num: 14
  heading: Критерії приймання та самоперевірка завдань
  type: content
  des: Формування вичерпних Acceptance Criteria, що включають негативні сценарії, інтеграції та умови SLA.
- page_num: 15
  heading: 'Практика: Якість, Jira та матриця простежуваності'
  type: content
  des: Виправлення неоднозначних тверджень, генерація завдань Jira та побудова ланцюжка простежуваності від джерела до критеріїв приймання.
- page_num: 16
  heading: 'Сесія BA-3: Запит на зміни та аналіз впливу'
  type: content
  des: 'Робота з запитом на Critical Service Request: від неструктурованого повідомлення клієнта до оцінки бізнес-впливу.'
- page_num: 17
  heading: Робочий процес обробки запитів на зміни
  type: content
  des: 'Етапи обробки: реєстрація, нормалізація, уточнення, оцінка та прийняття рішення щодо зміни.'
- page_num: 18
  heading: 'Класифікація: Дефект, уточнення чи запит на зміну'
  type: content
  des: Використання базового плану вимог для правильної класифікації запиту та визначення необхідності контролю змін.
- page_num: 19
  heading: Матриця функціонального впливу змін
  type: content
  des: Аналіз впливу зміни на ролі користувачів, бізнес-правила, UI, дані, інтеграції та існуючі завдання Jira.
- page_num: 20
  heading: Варіанти рішень та пакет для прийняття рішень
  type: content
  des: Порівняння мінімальних, рекомендованих та альтернативних варіантів реалізації Critical Service Request.
- page_num: 21
  heading: 'Практика: Обробка запиту на зміну ServiceHub'
  type: content
  des: Нормалізація запиту клієнта, побудова матриці впливу та підготовка пакету документів для затвердження рішення.
- page_num: 22
  heading: 'Сесія BA-4: Затверджені зміни та фінальний проєкт'
  type: content
  des: Оновлення базового плану після затвердження змін та підготовка до фінального випробування Capstone.
- page_num: 23
  heading: 'Робочий процес BA-4: Оновлення базового плану'
  type: content
  des: Порівняння станів до та після змін, оновлення вимог, критеріїв приймання та логу змін.
- page_num: 24
  heading: Пакет передачі вимог (Handoff) для команди
  type: content
  des: Формування фінального пакету для QA та розробників, включаючи межі, правила, залежності та відкриті питання.
- page_num: 25
  heading: 'Підсумкове завдання: BA Capstone'
  type: content
  des: Комплексна вправа з повним циклом управління вимогами на основі нового повідомлення від клієнта ServiceHub.
- page_num: 26
  heading: Критерії оцінювання підсумкового проєкту
  type: content
  des: Перевірка обґрунтованості класифікації змін, вимірюваності критеріїв та повноти аналізу функціонального впливу.
- page_num: 27
  heading: 'Практика: Виконання та огляд Capstone'
  type: content
  des: Самостійне виконання повного циклу BA-воркфлоу з використанням ШІ та фіксація людських точок перевірки.
- page_num: 28
  heading: Персональний AI Playbook бізнес-аналітика
  type: content
  des: Структура власної бібліотеки перевірених промптів для аналізу джерел, генерації Jira-завдань та оцінки впливу.
- page_num: 29
  heading: Самостійна практика, онлайн-тест та сертифікація
  type: content
  des: Опис 10-денної практики в навчальному середовищі та умови проходження фінального тесту для отримання сертифіката.
