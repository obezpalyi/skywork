<!DOCTYPE html><html lang="uk"><head>
  <meta charset="UTF-8"/>
  <title>QA Track Cover Page</title>
  <script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"/><style data-ppt-theme-fallback="">:root {
  --ppt-chart-1: #0D9488;
  --ppt-chart-2: #6366F1;
  --ppt-chart-3: #F59E0B;
  --ppt-chart-4: #EC4899;
  --ppt-good: #10B981;
  --ppt-warn: #F59E0B;
  --ppt-bad: #EF4444;
}
body { width: 1280px; height: 720px; overflow: hidden; }

html { overflow: hidden; }
</style><style>
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500;600&display=swap");

    :root {
      --ppt-bg: #F8FAFC;
      --ppt-bg-soft: #F1F5F9;
      --ppt-surface: #FFFFFF;
      --ppt-surface-2: #E2E8F0;
      --ppt-border: #CBD5E1;
      --ppt-text-1: #0F172A;
      --ppt-text-2: #475569;
      --ppt-text-3: #94A3B8;
      --ppt-accent: #0D9488;
      --ppt-accent-2: #6366F1;
      --ppt-radius-sm: 2px;
      --ppt-radius-md: 4px;
      --ppt-radius-lg: 8px;
      --ppt-shadow-soft: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      --ppt-shadow-strong: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --ppt-font-display: "Montserrat", sans-serif;
      --ppt-font-body: "Inter", sans-serif;
    }*{
      box-sizing: border-box;
      margin: 0 0;
      padding: 0 0;
    }

    body {width: 1280px; height: 720px; overflow: hidden;   
      background-color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      
      
    }

    .qa-track-slide-root-container {
      width: 1280px; height: 720px;
      background-color: var(--ppt-bg);
      background-image: 
        linear-gradient(var(--ppt-surface-2) 1px, transparent 1px),
        linear-gradient(90deg, var(--ppt-surface-2) 1px, transparent 1px);
      background-size: 40px 40px;
      display: flex;
      flex-direction: column;
      position: relative;
      
    }.qa-track-content-layout-wrapper{
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      padding: 24px 64px;
      gap: 15px 40px;
      width: 100%;
    }

    .qa-track-left-info-column {
      display: flex;
      flex-direction: column;
    }.qa-track-vertical-teal-anchor{
      width: 8px;
      height: 80px;
      background-color: var(--ppt-accent);
      margin-bottom: 19px;
    }.qa-track-title-block-group{
      margin-bottom: 86px;
    }

    .qa-track-main-heading-text {
      font-family: var(--ppt-font-display);
      font-size: 64px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--ppt-text-1);
      margin-bottom: 16px;
    }

    .qa-track-sub-heading-text {
      font-family: var(--ppt-font-display);
      font-size: 24px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--ppt-accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }.qa-track-metadata-footer-section{
      display: flex;
      flex-direction: column;
      gap: 6px 12px;
    }.qa-track-project-label-box{
      font-family: var(--ppt-font-body);
      font-size: 16px;
      font-weight: 600;
      color: var(--ppt-text-2);
      background-color: var(--ppt-surface-2);
      padding: 4px 16px;
      border-radius: var(--ppt-radius-sm);
      width: fit-content;
    }

    .qa-track-key-message-annotation {
      font-family: var(--ppt-font-body);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ppt-text-2);
      max-width: 500px;
    }

    .qa-track-right-visual-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
    }.qa-track-feature-image-wrapper{
      width: 100%;
      height: 494px;
      border-radius: var(--ppt-radius-lg);
      overflow: hidden;
      box-shadow: var(--ppt-shadow-strong);
      border: 8px solid var(--ppt-surface);
    }

    .qa-track-feature-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }.qa-track-session-badge-counter{
      margin-top: 16px;
      font-family: var(--ppt-font-display);
      font-size: 13px;
      font-weight: 700;
      color: var(--ppt-text-3);
      text-align: right;
    }
  
html { overflow: hidden; }
</style>
<meta name="PageAspectRatio" content="16:9"/><meta name="PageSize" content="1280_720"/></head>
<body>

  <div class="qa-track-slide-root-container">
    <div class="qa-track-content-layout-wrapper">
      
      <!-- Left Column: Branding, Title, and Metadata -->
      <div class="qa-track-left-info-column">
        <div class="qa-track-vertical-teal-anchor"></div>
        
        <div class="qa-track-title-block-group">
          <h1 class="qa-track-main-heading-text">
            AI-assisted Requirements and Change Management in SDLC
          </h1>
          <h2 class="qa-track-sub-heading-text">
            Quality Assurance Track
          </h2>
        </div>

        <div class="qa-track-metadata-footer-section">
          <div class="qa-track-project-label-box">
            Навчальний проєкт: ServiceHub
          </div>
          <p class="qa-track-key-message-annotation">
            Від огляду вимог до доказової готовності до тестування та регресії.
          </p>
        </div>
      </div>

      <!-- Right Column: Visual Representative Image -->
      <div class="qa-track-right-visual-column">
        <div class="qa-track-feature-image-wrapper">
          <img src="https://agents-download.skywork.ai/image/rt/bdbd4a83d31963bad7391bc6683f1170.jpg" alt="QA Team Collaboration"/>
        </div>
        <div class="qa-track-session-badge-counter">
          ПОВНИЙ НАВЧАЛЬНИЙ КУРС • 2026
        </div>
      </div>

    </div>
  </div>


</body></html>
