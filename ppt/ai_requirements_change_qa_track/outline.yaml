- page_num: 1
  heading: 'AI-assisted Requirements and Change Management in SDLC: QA Track'
  type: title
  des: Титульна сторінка курсу про управління вимогами та змінами за допомогою ШІ, адаптована спеціально для фахівців із забезпечення якості.
- page_num: 2
  heading: Чому цей трек важливий для QA
  type: content
  des: Огляд критичних проблем у тестуванні, таких як неповні вимоги та слабка простежуваність, які вирішуються в межах цього навчального курсу.
- page_num: 3
  heading: Навчальний маршрут та кінцеві результати
  type: content
  des: Опис чотирьох навчальних сесій та перелік фінальних артефактів, включаючи звіти про тестованість, матриці покриття та персональний AI Playbook.
- page_num: 4
  heading: 'Сесія QA-1: Цілі та вхідні дані'
  type: content
  des: Визначення цілей аналізу тестованості на основі вимог ServiceHub, бізнес-правил та карти інтеграцій.
- page_num: 5
  heading: Критерії тестованості вимог
  type: content
  des: 'Опис характеристик якісної вимоги: визначені ролі, стани, тригери та вимірювані умови без неоднозначних формулювань.'
- page_num: 6
  heading: Багаторазовий QA-промпт для аналізу
  type: content
  des: Структура промпту для Xplore, що включає роль рев'юера, контекст системи та вимоги до виявлення прогалин у тестованості.
- page_num: 7
  heading: 'Воркфлоу QA-1: Аналіз тестованості'
  type: content
  des: Покроковий процес від пошуку неоднозначностей до ранжування ризиків, пов'язаних із прогалинами у вимогах.
- page_num: 8
  heading: Демонстрація на проєкті ServiceHub
  type: content
  des: Практичний приклад аналізу Critical Service Request на предмет відсутності ролей, SLA та правил обробки помилок.
- page_num: 9
  heading: Практика та результати першої сесії
  type: content
  des: Завдання для учасників щодо виявлення дефектів тестованості та формування реєстру уточнювальних запитань для Product Owner.
- page_num: 10
  heading: 'Сесія QA-2: Цілі та вхідні дані'
  type: content
  des: Перехід від затверджених вимог до створення збалансованого набору тестів для функціоналу, API та інтеграцій.
- page_num: 11
  heading: Проєктування тестових умов
  type: content
  des: 'Визначення ключових сценаріїв: позитивні кейси, негативна поведінка, граничні значення та переходи між станами.'
- page_num: 12
  heading: 'Воркфлоу QA-2: Створення тестового набору'
  type: content
  des: Алгоритм трансформації критеріїв приймання у пріоритезовані тестові випадки з чіткими передумовами.
- page_num: 13
  heading: Генерація синтетичних тестових даних
  type: content
  des: Використання Xplore для створення безпечних тестових даних, таких як фіктивні користувачі та payloads для API.
- page_num: 14
  heading: Матриця покриття та простежуваність
  type: content
  des: Побудова ланцюжка від вимоги до результату виконання тесту для виявлення неперевірених ризиків.
- page_num: 15
  heading: Практика дизайну тестів ServiceHub
  type: content
  des: Створення тестового набору для критичних запитів, включаючи перевірку часових поясів, сповіщень та прав доступу.
- page_num: 16
  heading: 'Сесія QA-3: Управління змінами та контекст'
  type: content
  des: Порівняння базових версій вимог та визначення цілей для оцінки впливу змін на існуюче тестування.
- page_num: 17
  heading: 'Воркфлоу QA-3: Від запиту на зміни до регресії'
  type: content
  des: Процес ідентифікації змінених правил, застарілих тестів та аналізу непрямих ефектів на суміжні сервіси.
- page_num: 18
  heading: Аналіз прямого та непрямого впливу
  type: content
  des: Розмежування впливу на основну логіку (SLA, пріоритети) та непрямих наслідків для звітів і CRM-синхронізації.
- page_num: 19
  heading: 'Класифікація: Дефект чи запит на зміну'
  type: content
  des: Методика визначення природи невідповідності на основі затверджених вимог та доказів з Xplore.
- page_num: 20
  heading: Ризик-орієнтований обсяг регресії
  type: content
  des: Формування плану регресійного тестування з урахуванням ймовірності відмови та впливу на бізнес.
- page_num: 21
  heading: Практика аналізу впливу змін
  type: content
  des: Порівняння двох версій ServiceHub та класифікація спірних питань як дефектів або нових вимог.
- page_num: 22
  heading: 'Сесія QA-4: Затверджені зміни та обмеження'
  type: content
  des: Робота з новими обмеженнями, такими як підтримка кількох часових поясів, та їх узгодження з базовими вимогами.
- page_num: 23
  heading: 'Воркфлоу QA-4: Оновлення QA-пакета'
  type: content
  des: Фінальні кроки з актуалізації тестів, даних та перевірки готовності середовища перед релізом.
- page_num: 24
  heading: Формування висновку про готовність
  type: content
  des: Структурування доказів щодо покриття, відкритих дефектів та залишків ризиків для прийняття рішення про реліз.
- page_num: 25
  heading: Підсумковий проєкт QA Capstone
  type: content
  des: Комплексне завдання з опрацювання нової зміни в ServiceHub від аналізу тестованості до висновку про готовність.
- page_num: 26
  heading: Критерії успішного виконання Capstone
  type: content
  des: 'Вимоги до якості результатів: відсутність вигаданої поведінки, обґрунтованість ризиків та чітка простежуваність.'
- page_num: 27
  heading: Персональний QA AI Playbook
  type: content
  des: Збірник перевірених промптів для всіх етапів QA-процесу та чек-лісти для контролю якості роботи зі ШІ.
- page_num: 28
  heading: Самостійна практика та вдосконалення
  type: content
  des: План десятиденної практики для закріплення навичок роботи з воркфлоу та оптимізації промптів у Xplore.
- page_num: 29
  heading: Онлайн-тест та завершення курсу
  type: content
  des: Деталі фінального тестування, умови сертифікації та підтвердження практичного володіння інструментарієм курсу.
