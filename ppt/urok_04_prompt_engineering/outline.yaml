- page_num: 1
  heading: Prompt engineering
  type: title
  des: 'Мета уроку: навчитися формулювати конкретні та безпечні запити до ШІ, розуміючи причини різної якості відповідей моделі.'
- page_num: 2
  heading: Порівняємо два запити
  type: content
  des: Аналіз двох варіантів запитів про кібербезпеку для виявлення елементів, що допомагають створити максимально корисну та точну відповідь.
- page_num: 3
  heading: Що таке промпт
  type: content
  des: Визначення промпту як інструкції для моделі та пояснення Prompt engineering як вміння чітко описувати задачі й оцінювати результат.
- page_num: 4
  heading: Формула якісного промпту
  type: content
  des: Огляд шести ключових компонентів ідеального запиту, які допомагають прибрати неоднозначність при виконанні складних навчальних завдань.
- page_num: 5
  heading: Роль, аудиторія і контекст
  type: content
  des: Використання ролей, визначення цільової аудиторії та надання контексту для отримання точних пояснень на прикладі вивчення програмування.
- page_num: 6
  heading: Обмеження, формат і перевірка
  type: content
  des: Встановлення меж обсягу, вибір структури відповіді та правила безпеки щодо використання приватних даних у промптах.
- page_num: 7
  heading: Вправа «Ремонт промпту»
  type: content
  des: Практична групова робота з перетворення нечітких запитів на якісні інструкції за допомогою вивченої формули з шести компонентів.
- page_num: 8
  heading: 'Ітерація: перша відповідь не фінальна'
  type: content
  des: Процес циклічного вдосконалення результатів через оцінку відповідей, виявлення проблем та використання конкретних уточнювальних інструкцій.
- page_num: 9
  heading: Шаблон безпечного промпту
  type: content
  des: Представлення готової структури для створення безпечних запитів, де користувач залишається відповідальним редактором і автором результату.
- page_num: 10
  heading: Підсумок і exit ticket
  type: content
  des: Узагальнення критеріїв якості промпту, виконання перевірочного завдання та отримання домашньої роботи з ітераційного покращення запиту.
