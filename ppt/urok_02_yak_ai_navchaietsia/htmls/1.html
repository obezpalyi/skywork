<!DOCTYPE html><html lang="uk"><head>
  <meta charset="UTF-8"/>
  <title>Як AI навчається?</title>
  <script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"/><style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap");

    :root {
      --ppt-bg: #F9F9F7;
      --ppt-bg-soft: #F0F0EB;
      --ppt-surface: #FFFFFF;
      --ppt-surface-2: #E5E5E0;
      --ppt-border: #2D2D2D;
      --ppt-text-1: #1A1A1A;
      --ppt-text-2: #4A4A4A;
      --ppt-text-3: #757575;
      --ppt-accent: #00A896;
      --ppt-accent-2: #FF6B6B;
      --ppt-chart-1: #00A896;
      --ppt-chart-2: #028090;
      --ppt-chart-3: #F4D35E;
      --ppt-chart-4: #EE964B;
      --ppt-good: #27AE60;
      --ppt-warn: #F39C12;
      --ppt-bad: #E74C3C;
      --ppt-radius-sm: 2px;
      --ppt-radius-md: 4px;
      --ppt-radius-lg: 8px;
      --ppt-shadow-soft: 0 4px 12px rgba(0,0,0,0.05);
      --ppt-shadow-strong: 0 8px 24px rgba(0,0,0,0.1);
      --ppt-font-display: "Inter", sans-serif;
      --ppt-font-body: "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {width: 1280px; height: 720px; overflow: hidden;   
      background-color: #CCCCCC;
      display: flex;
      justify-content: center;
      align-items: center;
      
      font-family: var(--ppt-font-body);
    }

    .ai-learning-cover-root {
      width: 1280px; height: 720px;
      background-color: var(--ppt-bg);
      position: relative;
      
      display: flex;
      flex-direction: column;
      padding: 64px 80px;
    }

    .ai-learning-main-content-wrapper {
      display: grid;
      grid-template-columns: 55% 45%;
      align-items: center;
      margin-top: 40px;
    }

    .ai-learning-left-text-section {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .ai-learning-title-accent-container {
      border-left: 12px solid var(--ppt-accent);
      padding-left: 32px;
    }

    .ai-learning-main-title-text {
      font-family: var(--ppt-font-display);
      font-size: 68px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--ppt-text-1);
      margin-bottom: 24px;
    }

    .ai-learning-main-subtitle-text {
      font-family: var(--ppt-font-display);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--ppt-text-2);
      max-width: 90%;
    }

    .ai-learning-right-image-container {
      height: 400px;
      width: 100%;
      border-radius: var(--ppt-radius-lg);
      overflow: hidden;
      box-shadow: var(--ppt-shadow-strong);
      border: 1px solid var(--ppt-surface-2);
    }

    .ai-learning-cover-image-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ai-learning-header-tag {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .ai-learning-header-line {
      background-color: var(--ppt-accent);
      width: 4px;
      height: 24px;
    }

    .ai-learning-header-label {
      font-family: var(--ppt-font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--ppt-accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .ai-learning-bottom-metadata-bar {
      margin-top: 80px;
      display: flex;
      justify-content: flex-end;
      gap: 48px;
      border-top: 1px solid var(--ppt-surface-2);
      padding-top: 24px;
    }

    .ai-learning-metadata-item-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ai-learning-metadata-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--ppt-text-3);
      text-transform: uppercase;
    }

    .ai-learning-metadata-value {
      font-family: var(--ppt-font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--ppt-text-1);
    }
  
html { overflow: hidden; }
</style>
<meta name="PageAspectRatio" content="16:9"/><meta name="PageSize" content="1280_720"/></head>
<body>

  <div class="ai-learning-cover-root">
    
    <!-- Top Decorative Header -->
    <div class="ai-learning-header-tag">
      <span class="ai-learning-header-line"></span>
      <span class="ai-learning-header-label">УРОК ІНФОРМАТИКИ | ШТУЧНИЙ ІНТЕЛЕКТ</span>
    </div>

    <!-- Main Content Grid -->
    <div class="ai-learning-main-content-wrapper">
      
      <!-- Left: Title Block -->
      <div class="ai-learning-left-text-section">
        <div class="ai-learning-title-accent-container">
          <h1 class="ai-learning-main-title-text">Як AI<br/>навчається?</h1>
          <h2 class="ai-learning-main-subtitle-text">
            Від жорстких правил до самостійного пошуку закономірностей у даних
          </h2>
        </div>
      </div>

      <!-- Right: Visual Block -->
      <div class="ai-learning-right-image-container">
        <img src="https://skyagent-artifacts.skywork.ai/image/5940376570349285532/2095588008574488576/2095588008574488577.png" alt="Листя клена та дуба для класифікації" class="ai-learning-cover-image-element"/>
      </div>

    </div>

    <!-- Bottom: Metadata -->
    <div class="ai-learning-bottom-metadata-bar">
      <div class="ai-learning-metadata-item-box">
        <span class="ai-learning-metadata-label">Аудиторія</span>
        <span class="ai-learning-metadata-value">11 КЛАС</span>
      </div>
      <div class="ai-learning-metadata-item-box">
        <span class="ai-learning-metadata-label">Модуль</span>
        <span class="ai-learning-metadata-value">ОСНОВИ AI</span>
      </div>
      <div class="ai-learning-metadata-item-box">
        <span class="ai-learning-metadata-label">Номер заняття</span>
        <span class="ai-learning-metadata-value">УРОК №2</span>
      </div>
    </div>

  </div>


</body></html>
