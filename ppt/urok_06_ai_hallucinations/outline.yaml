- page_num: 1
  heading: AI hallucinations
  type: title
  des: Вступ до теми галюцинацій генеративного ШІ, мета якого — навчитися розпізнавати вигадані факти та опанувати навички фактчекінгу відповідей чат-ботів.
- page_num: 2
  heading: Якій відповіді ви довіритеся?
  type: content
  des: Інтерактивне порівняння двох варіантів відповідей ШІ для виявлення ознак надійності та обговорення важливості перевірки впевнено наведених цитат і джерел.
- page_num: 3
  heading: Що таке галюцинація ШІ
  type: content
  des: Визначення галюцинації як правдоподібної, але неточної або вигаданої частини відповіді, що включає неіснуючі посилання, дати чи помилкові пояснення.
- page_num: 4
  heading: Чому це відбувається
  type: content
  des: Пояснення механізму роботи мовних моделей як статистичного передбачення тексту, де неповний контекст або прогалини в навчанні спонукають систему до вигадування.
- page_num: 5
  heading: Червоні прапорці
  type: content
  des: 'Перелік ознак потенційної помилки: надто точні числа без джерел, дивні посилання, категоричний тон та суперечність тверджень базовим фактам.'
- page_num: 6
  heading: Алгоритм фактчекінгу
  type: content
  des: 'Покрокова інструкція перевірки інформації: виділення тверджень, пошук першоджерел, порівняння з незалежними ресурсами та формування остаточного вердикту.'
- page_num: 7
  heading: Лабораторія фактчекінгу
  type: content
  des: Практична групова робота з аналізу відповідей ШІ за допомогою таблиці, що включає пошукові запити, перевірку контексту та обґрунтування достовірності.
- page_num: 8
  heading: Які джерела сильніші
  type: content
  des: Ієрархія надійності ресурсів, де пріоритет надається офіційним документам та академічним виданням перед дописами у соцмережах та форумами.
- page_num: 9
  heading: Промпт, який допомагає перевіряти
  type: content
  des: Використання спеціальних вказівок для ШІ, щоб змусити модель маркувати факти, припущення та вказувати на власну невпевненість у відповіді.
- page_num: 10
  heading: Підсумок і exit ticket
  type: content
  des: Узагальнення трьох кроків перевірки та домашнє завдання з верифікації тверджень чат-бота за допомогою порівняльної таблиці.
