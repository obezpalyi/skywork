    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --ppt-bg: #F8FAFC;
      --ppt-bg-soft: #F1F5F9;
      --ppt-surface: #FFFFFF;
      --ppt-surface-2: #E2E8F0;
      --ppt-border: #CBD5E1;
      --ppt-text-1: #0F172A;
      --ppt-text-2: #475569;
      --ppt-text-3: #64748B;
      --ppt-accent: #0D9488;
      --ppt-accent-2: #0891B2;
      --ppt-chart-1: #0D9488;
      --ppt-chart-2: #0891B2;
      --ppt-chart-3: #4F46E5;
      --ppt-chart-4: #7C3AED;

      --ppt-warn: #F59E0B;
      --ppt-bad: #EF4444;
      --ppt-radius-sm: 2px;
      --ppt-radius-md: 6px;
      --ppt-radius-lg: 10px;
      --ppt-shadow-soft: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --ppt-shadow-strong: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --ppt-font-display: "Inter", sans-serif;
      --ppt-font-body: "Inter", sans-serif;
      --ppt-font-mono: "IBM Plex Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {width: 1280px; height: 720px; overflow: hidden;   
      background-color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      
      font-family: var(--ppt-font-body);
    }

    .ai-lesson-cover-slide-root {
      width: 1280px; height: 720px;
      background-color: var(--ppt-bg);
      background-image: 
        linear-gradient(var(--ppt-surface-2) 1px, transparent 1px),
        linear-gradient(90deg, var(--ppt-surface-2) 1px, transparent 1px);
      background-size: 40px 40px;
      
      display: flex;
      flex-direction: column;
      color: var(--ppt-text-1);
    }

    .ai-lesson-main-layout-container {
      padding: 80px 80px 0 80px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 60px;
    }

    .ai-lesson-text-content-column {
      display: flex;
      flex-direction: column;
      width: 60%;
    }

    .ai-lesson-unit-badge-wrapper {
      margin-bottom: 24px;
    }

    .ai-lesson-unit-tag-label {
      font-family: var(--ppt-font-mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--ppt-accent);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: var(--ppt-bg-soft);
      padding: 6px 12px;
      border-radius: var(--ppt-radius-sm);
      border-left: 3px solid var(--ppt-accent);
    }

    .ai-lesson-title-display-text {
      font-family: var(--ppt-font-display);
      font-size: 68px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--ppt-text-1);
      margin-bottom: 24px;
    }

    .ai-lesson-accent-separator-line {
      width: 120px;
      height: 6px;
      background-color: var(--ppt-accent);
      margin-bottom: 32px;
      border-radius: var(--ppt-radius-sm);
    }

    .ai-lesson-subtitle-display-text {
      font-family: var(--ppt-font-body);
      font-size: 24px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--ppt-text-2);
      max-width: 90%;
    }

    .ai-lesson-hero-visual-frame {
      width: 40%;
      height: 440px;
      border-radius: var(--ppt-radius-lg);
      
      box-shadow: var(--ppt-shadow-strong);
      border: 1px solid var(--ppt-border);
    }

    .ai-lesson-hero-image-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ai-lesson-footer-metadata-wrapper {
      margin-top: 60px;
      padding: 0 80px;
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 40px;
    }

    .ai-lesson-metadata-info-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ai-lesson-metadata-label-tag {
      font-family: var(--ppt-font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--ppt-text-3);
      text-transform: uppercase;
    }

    .ai-lesson-metadata-value-text {
      font-family: var(--ppt-font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--ppt-text-2);
    }

    .ai-lesson-footer-spacer-block {
      flex-grow: 1;
    }

    .ai-lesson-technical-stamp-box {
      border: 1px solid var(--ppt-border);
      padding: 12px;
      border-radius: var(--ppt-radius-md);
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--ppt-surface);
    }

    .ai-lesson-stamp-code-text {
      font-family: var(--ppt-font-mono);
      font-size: 10px;
      color: var(--ppt-text-3);
    }
  
html { overflow: hidden; }
</style>
