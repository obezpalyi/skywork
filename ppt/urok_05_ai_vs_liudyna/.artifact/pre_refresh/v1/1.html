      --ppt-radius-sm: 4px;
      --ppt-radius-md: 12px;

    .ai-human-lesson-canvas {
      width: 1280px; height: 720px;
      background-color: var(--ppt-bg);
      position: relative;
      
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .ai-human-background-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px; height: 720px;
      z-index: 0;
    }

    .ai-human-cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ai-human-overlay-scrim {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(248, 249, 250, 0.96) 0%, rgba(248, 249, 250, 0.88) 100%);
      z-index: 1;
    }

    .ai-human-foreground-layout {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 64px 80px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .ai-human-top-label-wrapper {
      margin-bottom: 140px;
      display: flex;
      align-items: center;
    }

    .ai-human-module-tag {
      font-family: var(--ppt-font-mono);
      font-size: 16px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--ppt-accent);
      background: rgba(99, 102, 241, 0.08);
      padding: 8px 16px;
      border-radius: var(--ppt-radius-sm);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .title-ai-vs-human-main-heading-group {
      display: flex;
      align-items: center;
      gap: 40px;
      margin-bottom: 32px;
    }

    .title-ai-vs-human-main-heading-group span {
      font-family: var(--ppt-font-display);
      font-size: 72px;
      font-weight: 800;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .title-ai-text-indigo {
      color: var(--ppt-accent);
    }

    .title-human-text-rose {
      color: var(--ppt-accent-2);
    }

    .title-ai-human-vertical-separator {
      width: 2px;
      height: 80px;
      background-color: var(--ppt-border);
    }

    .ai-human-subtitle-box {
      width: 60%;
      margin-bottom: 48px;
    }

    .ai-human-subtitle-text {
      font-family: var(--ppt-font-display);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--ppt-text-2);
    }

    .ai-human-metadata-footer-group {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
    }

    .ai-human-metadata-item-card {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      padding: 16px 24px;
      background: var(--ppt-surface);
      border: 1px solid var(--ppt-border);
      border-radius: var(--ppt-radius-md);
      box-shadow: var(--ppt-shadow-soft);
    }

    .ai-human-metadata-label {
      font-family: var(--ppt-font-display);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--ppt-text-3);
    }

    .ai-human-metadata-value {
      font-family: var(--ppt-font-display);
      font-size: 18px;
      font-weight: 600;
      color: var(--ppt-text-1);
    }

    .ai-human-decorative-accent-dot {
      position: absolute;
      top: 64px;
      right: 80px;
      width: 12px;
      height: 12px;
      background-color: var(--ppt-accent-2);
      border-radius: 50%;
    }
