- page_num: 1
  heading: 'AI-assisted Requirements and Change Management in SDLC: DevOps Track'
  type: title
  des: Навчальний курс, зосереджений на управлінні вимогами та змінами в SDLC для DevOps-фахівців з використанням інструментів штучного інтелекту.
- page_num: 2
  heading: Чому цей трек важливий для DevOps
  type: content
  des: Усунення прогалин в операційних вимогах, прискорення роботи з документацією та запобігання помилкам при розгортанні й відкатах систем.
- page_num: 3
  heading: Навчальний маршрут та очікувані результати
  type: content
  des: Огляд чотирьох сесій курсу від аналізу вимог до готовності до релізу та формування персонального DevOps AI Playbook.
- page_num: 4
  heading: 'Сесія OPS-1: Операційний контекст вимог'
  type: content
  des: Цілі та вхідні дані для виявлення операційно значущих очікувань і зв'язку вимог із сервісами та власниками.
- page_num: 5
  heading: Критерії операційної повноти вимог
  type: content
  des: Перевірка доступності, продуктивності, масштабованості, безпеки та спостережуваності для забезпечення стабільної роботи системи.
- page_num: 6
  heading: DevOps промпт для аналізу вимог
  type: content
  des: Структура промпту для аналізу операційних потреб із дотриманням правил безпеки та використанням плейсхолдерів для конфіденційних даних.
- page_num: 7
  heading: 'Робочий процес OPS-1: Від вимог до операційного звіту'
  type: content
  des: Етапи ідентифікації критичної поведінки бізнесу, залежностей, потреб у моніторингу та правил ескалації.
- page_num: 8
  heading: Демонстрація на кейсі ServiceHub
  type: content
  des: Аналіз запиту на зміну Critical Service Request за допомогою Xplore для виявлення операційних ризиків та невідомих параметрів.
- page_num: 9
  heading: Практика та результати першої сесії
  type: content
  des: Формування звіту про операційні вимоги, реєстру запитань та перевірених шаблонів промптів для DevOps.
- page_num: 10
  heading: 'Сесія OPS-2: Інфраструктура, конфігурація та спостережуваність'
  type: content
  des: Оцінка впливу змін на середовища, ресурси та налаштування моніторингу на основі технічного дизайну.
- page_num: 11
  heading: Домени операційного впливу
  type: content
  des: 'Огляд сфер впливу: від мережевих налаштувань та сховищ даних до конфігураційних параметрів і пайплайнів розгортання.'
- page_num: 12
  heading: 'Робочий процес OPS-2: Матриця операційного впливу'
  type: content
  des: Мапування змін на сервіси, виявлення відмінностей між середовищами та визначення нових метрик і сповіщень.
- page_num: 13
  heading: Огляд конфігурації та інфраструктури
  type: content
  des: Використання Xplore для структурування даних про ресурси та методи розгортання без передачі конфіденційних облікових даних.
- page_num: 14
  heading: Спостережуваність для Critical Service Request
  type: content
  des: Визначення сигналів успіху ескалації, затримок обробки та черг повідомлень для узгодження з бізнес-ризиками.
- page_num: 15
  heading: 'Практика: Створення матриці операційного впливу'
  type: content
  des: Документування впливу на IaC, визначення прогалин у сповіщеннях та підготовка переліку змін для спостережуваності.
- page_num: 16
  heading: 'Сесія OPS-3: Розгортання, відкат та готовність до релізу'
  type: content
  des: Планування впровадження схваленого дизайну, включаючи автоматичну ескалацію та зміни в моделі даних.
- page_num: 17
  heading: 'Робочий процес OPS-3: Планування розгортання'
  type: content
  des: Визначення послідовності кроків, перевірок перед впровадженням та активації функціональних прапорців.
- page_num: 18
  heading: Структура плану розгортання
  type: content
  des: Опис кроків міграції, конфігурації та верифікації з чітким визначенням відповідальних та очікуваної тривалості.
- page_num: 19
  heading: Стратегія та план відкату
  type: content
  des: Визначення тригерів для відкату, повноважень для прийняття рішень та забезпечення цілісності даних при поверненні до попередньої версії.
- page_num: 20
  heading: Докази готовності до випуску
  type: content
  des: Перевірка інфраструктури, готовності моніторингу, наявності чергових інженерів та оцінка відомих ризиків перед релізом.
- page_num: 21
  heading: 'Практика: Підготовка процедур розгортання'
  type: content
  des: Створення послідовності кроків розгортання, тригерів відкату та чернетки статусу готовності релізу.
- page_num: 22
  heading: 'Сесія OPS-4: Операційна готовність та DevOps Capstone'
  type: content
  des: Врахування нових обмежень, таких як використання feature-flags та інтеграція із зовнішніми системами.
- page_num: 23
  heading: 'Робочий процес OPS-4: Оновлення операційного пакету'
  type: content
  des: Аналіз попередніх інцидентів, оновлення планів розгортання, метрик та документації з урахуванням отриманих уроків.
- page_num: 24
  heading: Оновлення експлуатаційної документації (Runbook)
  type: content
  des: Документування сигналів виявлення проблем, процедур ескалації та пом'якшення наслідків за допомогою Xplore.
- page_num: 25
  heading: Підсумкове завдання DevOps Capstone
  type: content
  des: 'Комплексна робота над новим запитом ServiceHub: від аналізу вимог до підготовки рекомендації Go/No-Go.'
- page_num: 26
  heading: Критерії оцінки Capstone проекту
  type: content
  des: Перевірка повноти аналізу впливу, простежуваності змін, безпеки даних та явної участі людини в прийнятті рішень.
- page_num: 27
  heading: Персональний DevOps AI Playbook
  type: content
  des: Збір перевірених промптів для аналізу вимог, інфраструктури, планів розгортання та оновлення ранбуків.
- page_num: 28
  heading: Самостійна практика та закріплення навичок
  type: content
  des: Десять робочих днів для повторення воркфлоу, тестування промптів на складних кейсах та вдосконалення Playbook.
- page_num: 29
  heading: Онлайн-тест та сертифікація курсу
  type: content
  des: Підсумкове тестування з 30 питань для підтвердження навичок використання AI-інструментів у DevOps-процесах.
