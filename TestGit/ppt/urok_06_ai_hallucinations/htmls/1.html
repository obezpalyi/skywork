<!DOCTYPE html><html lang="uk"><head>
  <meta charset="UTF-8"/>
  <title>AI Hallucinations - Презентація</title>
  <script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"/><style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap");

    :root {
      --ppt-bg: #0F172A;
      --ppt-bg-soft: #1E293B;
      --ppt-surface: #334155;
      --ppt-surface-2: #475569;
      --ppt-border: #38BDF8;
      --ppt-text-1: #F8FAFC;
      --ppt-text-2: #CBD5E1;
      --ppt-text-3: #94A3B8;
      --ppt-accent: #38BDF8;
      --ppt-accent-2: #818CF8;
      --ppt-chart-1: #38BDF8;
      --ppt-chart-2: #818CF8;
      --ppt-chart-3: #2DD4BF;
      --ppt-chart-4: #F472B6;
      --ppt-good: #10B981;
      --ppt-warn: #F59E0B;
      --ppt-bad: #EF4444;
      --ppt-radius-sm: 2px;
      --ppt-radius-md: 4px;
      --ppt-radius-lg: 8px;
      --ppt-shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --ppt-shadow-strong: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      --ppt-font-display: "Space Grotesk", sans-serif;
      --ppt-font-body: "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {width: 1280px; height: 720px; overflow: hidden;   
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      
      
    }

    .ai-hallucinations-cover-root {
      width: 1280px; height: 720px;
      background-color: var(--ppt-bg);
      color: var(--ppt-text-1);
      font-family: var(--ppt-font-body);
      
      display: flex;
      flex-direction: row;
    }

    .ai-hallucinations-left-content-column {
      display: flex;
      flex-direction: column;
      width: 55%;
      padding-left: 64px;
      padding-right: 32px;
      padding-top: 120px;
      padding-bottom: 64px;
    }

    .ai-hallucinations-title-group-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .ai-hallucinations-main-title-heading {
      font-family: var(--ppt-font-display);
      font-size: 72px;
      font-weight: 700;
      line-height: 1.05;
      color: var(--ppt-text-1);
      margin: 0;
    }

    .ai-hallucinations-sub-title-description {
      font-family: var(--ppt-font-body);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--ppt-accent);
      margin: 0;
    }

    .ai-hallucinations-intro-question-text {
      font-family: var(--ppt-font-body);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ppt-text-2);
      margin-top: 40px;
      max-width: 90%;
    }

    .ai-hallucinations-spacer-flexible-element {
      flex-grow: 1;
    }

    .ai-hallucinations-metadata-footer-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ai-hallucinations-meta-info-item {
      font-family: var(--ppt-font-body);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--ppt-text-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .ai-hallucinations-right-visual-column {
      width: 45%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 64px;
    }

    .ai-hallucinations-hero-image-container {
      width: 100%;
      height: 520px;
      border-radius: var(--ppt-radius-lg);
      overflow: hidden;
      border: 1px solid var(--ppt-surface);
      box-shadow: var(--ppt-shadow-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--ppt-bg-soft);
    }

    .ai-hallucinations-hero-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  
html { overflow: hidden; }
</style>

        <h1 class="ai-hallucinations-main-title-heading">

      <p class="ai-hallucinations-intro-question-text">
        Чому чат-бот може впевнено повідомити те, чого не існує? Розпізнаємо галюцинації, перевіряємо твердження та опановуємо цифрову верифікацію.
      </p>

      <div class="ai-hallucinations-spacer-flexible-element"></div>

      <div class="ai-hallucinations-metadata-footer-group">
        <div class="ai-hallucinations-meta-info-item">
          Інформатика, 11 клас
        </div>
        <div class="ai-hallucinations-meta-info-item">

        </div>
      </div>

    </div>

    <!-- Right Column: Visual Balance -->
    <div class="ai-hallucinations-right-visual-column">
      <div class="ai-hallucinations-hero-image-container">
        <img src="https://agents-download.skywork.ai/image/rt/4c9ad2855d81ebf7e8ae8b3a64e90661.jpg" alt="AI Fact Checking Verification"/>
      </div>
    </div>

  </div>


</body></html>
