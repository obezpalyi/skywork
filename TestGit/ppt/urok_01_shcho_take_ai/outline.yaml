- page_num: 1
  heading: Що таке AI насправді?
  type: title
  des: Вступ до теми реалістичного уявлення про штучний інтелект, головне запитання уроку та очікувані результати навчання для учнів 11 класу.
- page_num: 2
  heading: 'Розминка: де тут ШІ?'
  type: content
  des: Швидке голосування класу для визначення, які з популярних технологій використовують ШІ, а які працюють за наперед заданими алгоритмами.
- page_num: 3
  heading: Робоче визначення штучного інтелекту
  type: content
  des: Визначення ШІ як класу систем для розпізнавання, прогнозування та створення контенту на основі виявлення закономірностей у даних.
- page_num: 4
  heading: Алгоритм, дані та модель
  type: content
  des: 'Пояснення ключових компонентів ШІ: різниця між жорсткими правилами алгоритму та гнучкістю математичних моделей, що навчаються на прикладах.'
- page_num: 5
  heading: Вузький ШІ та його можливості
  type: content
  des: Огляд сучасних систем вузького ШІ, які ефективно виконують конкретні завдання, але не мають універсального розуміння навколишнього світу.
- page_num: 6
  heading: 'Генеративний ШІ: створення нового'
  type: content
  des: Принципи роботи генеративного ШІ, який створює тексти, зображення та код, формуючи результат відповідно до запиту та контексту навчання.
- page_num: 7
  heading: Чого сучасний ШІ не гарантує
  type: content
  des: 'Аналіз обмежень ШІ: відсутність гарантій істинності, людського досвіду, моральної відповідальності та свідомості в роботі алгоритмів.'
- page_num: 8
  heading: 'Групова вправа: Класифікуємо системи'
  type: content
  des: Практичне завдання для груп з розподілу технологій за категоріями використання ШІ та аргументація вибору на основі механізмів їхньої роботи.
- page_num: 9
  heading: Правило відповідального користувача
  type: content
  des: Формування критичного ставлення до ШІ як інструменту прогнозування та алгоритм перевірки результатів перед їх використанням.
- page_num: 10
  heading: Підсумок і домашнє завдання
  type: content
  des: Узагальнення ключових тез уроку, вправа Exit ticket та завдання з пошуку прикладів ШІ у повсякденному житті з аналізом ризиків.
