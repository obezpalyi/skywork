- page_num: 1
  heading: AI vs людина
  type: title
  des: Вступний слайд про порівняння сильних сторін, обмежень та відповідальності людини й штучного інтелекту в процесі співпраці.
- page_num: 2
  heading: Швидке голосування
  type: content
  des: Інтерактивне опитування щодо можливості заміни фахівців штучним інтелектом з акцентом на аналіз конкретних завдань усередині професій.
- page_num: 3
  heading: Сильні сторони ШІ
  type: content
  des: 'Огляд переваг ШІ: швидка обробка даних, пошук статистичних закономірностей, створення чернеток та автоматизація повторюваних операцій.'
- page_num: 4
  heading: Сильні сторони людини
  type: content
  des: 'Визначення людських переваг: постановка цілей, розуміння контексту, емпатія та повна моральна і юридична відповідальність за рішення.'
- page_num: 5
  heading: Де ШІ слабкий
  type: content
  des: Аналіз обмежень ШІ, включаючи схильність до помилок, залежність від даних, упередженість та нездатність визначати справедливість мети.
- page_num: 6
  heading: Не професії, а задачі
  type: content
  des: Приклади розподілу ролей між людиною та ШІ у роботі вчителя, програміста та лікаря для підвищення ефективності.
- page_num: 7
  heading: Вправа Хто виконує?
  type: content
  des: 'Практичне завдання із сортування задач за категоріями: виконання переважно ШІ, переважно людиною або їхньою спільною працею.'
- page_num: 8
  heading: Міні-дебати
  type: content
  des: Обговорення тези про необхідність участі людини у швидких процесах автоматизації, аналіз ризиків та унікальних людських функцій.
- page_num: 9
  heading: Модель ШІ допомагає — людина відповідає
  type: content
  des: 'Опис алгоритму співпраці: людина ставить мету та контролює результат, а ШІ аналізує дані та генерує варіанти.'
- page_num: 10
  heading: Підсумок і exit ticket
  type: content
  des: Узагальнення правила про відповідальність людини та оголошення домашнього завдання щодо написання есе про делегування задач.
