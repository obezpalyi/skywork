<!DOCTYPE html><html lang="uk"><head>
  <meta charset="UTF-8"/>
  <title>Prompt Engineering Cover Page</title>
  <script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"/><style>
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&family=Inter:wght@400;600&display=swap");

    :root {
      --ppt-bg: #FDFCFB;
      --ppt-bg-soft: #F3F4F6;
      --ppt-surface: #FFFFFF;
      --ppt-surface-2: #EEF2FF;
      --ppt-border: #E5E7EB;
      --ppt-text-1: #111827;
      --ppt-text-2: #4B5563;
      --ppt-text-3: #9CA3AF;
      --ppt-accent: #6366F1;
      --ppt-accent-2: #10B981;
      --ppt-chart-1: #6366F1;
      --ppt-chart-2: #10B981;
      --ppt-chart-3: #F59E0B;
      --ppt-chart-4: #EC4899;
      --ppt-good: #059669;
      --ppt-warn: #D97706;
      --ppt-bad: #DC2626;
      --ppt-radius-sm: 4px;
      --ppt-radius-md: 8px;
      --ppt-radius-lg: 16px;
      --ppt-shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --ppt-shadow-strong: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --ppt-font-display: "Montserrat", sans-serif;
      --ppt-font-body: "Inter", sans-serif;
    }

    body {width: 1280px; height: 720px; overflow: hidden;   
      
      
      background-color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      
      
    }

    .pe-cover-page-root-container {
      width: 1280px; height: 720px;
      background-color: var(--ppt-bg);
      display: flex;
      flex-direction: row;
      
      position: relative;
    }

    .pe-cover-left-text-column {
      width: 55%; height: 720px;
      padding: 80px 0 80px 80px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      z-index: 2;
    }

    .pe-cover-title-text-region {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .pe-cover-main-title-heading {
      margin: 0;
      font-family: var(--ppt-font-display);
      font-size: 68px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--ppt-text-1);
      letter-spacing: -1px;
    }

    .pe-cover-sub-title-paragraph {
      margin: 0;
      font-family: var(--ppt-font-display);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--ppt-text-2);
      max-width: 580px;
    }

    .pe-cover-accent-highlight-span {
      color: var(--ppt-accent);
      font-weight: 800;
    }

    .pe-cover-meta-data-footer {
      margin-top: 180px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pe-cover-meta-info-item {
      font-family: var(--ppt-font-body);
      font-size: 18px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--ppt-text-3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .pe-cover-right-visual-column {
      width: 45%; height: 720px;
      position: relative;
      z-index: 1;
    }

    .pe-cover-image-frame-box {
      width: 100%; height: 720px;
      overflow: hidden;
    }

    .pe-cover-visual-image-item {
      width: 100%; height: 720px;
      object-fit: cover;
    }

    .pe-cover-image-gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%; height: 720px;
      background: linear-gradient(to right, var(--ppt-bg) 0%, transparent 40%);
      z-index: 2;
    }

    .pe-cover-decorative-accent-line {
      width: 80px;
      height: 6px;
      background-color: var(--ppt-accent);
      border-radius: var(--ppt-radius-sm);
      margin-bottom: 24px;
    }
  
html { overflow: hidden; }
</style>
<meta name="PageAspectRatio" content="16:9"/><meta name="PageSize" content="1280_720"/></head>
<body>

  <div class="pe-cover-page-root-container">
    <!-- Left Content Section -->
    <div class="pe-cover-left-text-column">
      <div class="pe-cover-decorative-accent-line"></div>
      
      <div class="pe-cover-title-text-region">
        <h1 class="pe-cover-main-title-heading">
          Prompt<br/>engineering
        </h1>
        <p class="pe-cover-sub-title-paragraph">
          Навчіться формулювати <span class="pe-cover-accent-highlight-span">конкретні</span>, 
          <span class="pe-cover-accent-highlight-span">безпечні</span> та перевірювані запити до штучного інтелекту.
        </p>
      </div>

      <div class="pe-cover-meta-data-footer">
        <div class="pe-cover-meta-info-item">Урок інформатики</div>
        <div class="pe-cover-meta-info-item">11 Клас</div>
        <div class="pe-cover-meta-info-item">2026</div>
      </div>
    </div>

    <!-- Right Image Section -->
    <div class="pe-cover-right-visual-column">
      <div class="pe-cover-image-gradient-overlay"></div>
      <div class="pe-cover-image-frame-box">
        <img src="https://skyagent-artifacts.skywork.ai/image/5940376570349285532/2095590954905276416/2095590954905276417.png" alt="Prompt Engineering Visual" class="pe-cover-visual-image-item"/>
      </div>
    </div>
  </div>


</body></html>
