- page_num: 1
  heading: Як AI навчається?
  type: title
  des: Вступ до теми навчання штучного інтелекту, розгляд понять даних, ознак та прогнозування на прикладі розпізнавання листя дерев.
- page_num: 2
  heading: Два способи навчити комп’ютер
  type: content
  des: Порівняння підходу на основі жорстких правил та машинного навчання через приклади для виявлення закономірностей у складних задачах.
- page_num: 3
  heading: Що таке машинне навчання
  type: content
  des: Визначення машинного навчання як процесу пошуку закономірностей у даних для створення прогнозів без прямого програмування кожного кроку.
- page_num: 4
  heading: Дані, ознаки та мітки
  type: content
  des: 'Розгляд ключових компонентів навчання: об''єктів для аналізу, їхніх характеристик (ознак) та правильних відповідей (міток), які модель має передбачити.'
- page_num: 5
  heading: Ланцюжок машинного навчання
  type: content
  des: Опис циклічного процесу від збору даних до навчання моделі, її тестування на нових прикладах, аналізу помилок та подальшого вдосконалення.
- page_num: 6
  heading: Вправа «Фрум чи лора?»
  type: content
  des: Практичне завдання з класифікації вигаданих фруктів за кольором і формою, де учні самостійно формулюють правила розрізнення об'єктів.
- page_num: 7
  heading: 'Тест: нові приклади'
  type: content
  des: Перевірка розроблених правил на нових даних для оцінки якості моделі та розуміння важливості тестування на незнайомих прикладах.
- page_num: 8
  heading: Чому модель помиляється?
  type: content
  des: 'Аналіз причин виникнення помилок: брак даних, невідповідні ознаки, помилкові мітки або суттєва відмінність нових прикладів від навчальних.'
- page_num: 9
  heading: Упередження в даних
  type: content
  des: Обговорення проблеми нерепрезентативності даних та наслідків використання моделей, що працюють некоректно через обмеженість навчальної вибірки.
- page_num: 10
  heading: Підсумок і exit ticket
  type: content
  des: Узагальнення пройденого матеріалу, виконання фінального завдання для самоперевірки та пояснення домашнього завдання щодо аналізу реальних AI-систем.
