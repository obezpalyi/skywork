    <meta name="viewport" content="width=1280, height=720"/>
    <title>Створюємо власного AI-помічника</title>
    <script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"/><style data-ppt-theme-fallback="">:root {
  --ppt-chart-1: #10B981;
  --ppt-chart-2: #6366F1;
  --ppt-chart-3: #F59E0B;
  --ppt-chart-4: #EF4444;
  --ppt-good: #059669;
  --ppt-warn: #D97706;
  --ppt-bad: #DC2626;
}
body { width: 1280px; height: 720px; overflow: hidden; }

html { overflow: hidden; }
</style><style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap');

        :root {
            --ppt-bg: #F9FAFB;
            --ppt-bg-soft: #F3F4F6;
            --ppt-surface: #FFFFFF;
            --ppt-surface-2: #EEF2FF;
            --ppt-border: #E5E7EB;
            --ppt-text-1: #111827;
            --ppt-text-2: #4B5563;
            --ppt-text-3: #9CA3AF;
            --ppt-accent: #10B981;
            --ppt-accent-2: #6366F1;
            --ppt-radius-sm: 4px;
            --ppt-radius-md: 6px;
            --ppt-radius-lg: 0px;
            --ppt-shadow-soft: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --ppt-shadow-strong: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --ppt-font-display: "Montserrat", sans-serif;
            --ppt-font-body: "Inter", sans-serif;
        }*{
            box-sizing: border-box;
            margin: 0 0;
            padding: 0 0;
        }

        body {width: 1280px; height: 720px; overflow: hidden;   
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            
            
        }

        .ai-lab-slide-root {
            width: 1280px; height: 720px;
            background-color: var(--ppt-bg);
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            
            position: relative;
        }

        .ai-lab-background-image-container {
            grid-area: 1 / 1 / 2 / 2;
            position: relative;
            z-index: 0; height: 720px;
            overflow: hidden;
        }

        .ai-lab-background-image-item {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .ai-lab-overlay-gradient-layer {
            grid-area: 1 / 1 / 2 / 2;
            position: relative;
            z-index: 1; height: 720px;
            background: linear-gradient(to bottom, 
                rgba(249, 250, 251, 0.1) 0%, 
                rgba(249, 250, 251, 0.6) 40%, 
                rgba(249, 250, 251, 0.95) 75%, 
                rgba(249, 250, 251, 1) 100%
            );
        }.ai-lab-content-layout-wrapper{
            grid-area: 1 / 1 / 2 / 2;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            padding-left: 80px;
            padding-right: 80px;
            padding-top: 51px;
            padding-bottom: 64px;
        }.ai-lab-top-metadata-container{
            display: flex;
            flex-direction: column;
            gap: 6px 8px;
        }

        .ai-lab-metadata-label-item {
            font-family: var(--ppt-font-body);
            font-size: 16px;
            font-weight: 600;
            color: var(--ppt-accent-2);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            line-height: 1.4;
        }

        .ai-lab-metadata-sublabel-item {
            font-family: var(--ppt-font-body);
            font-size: 16px;
            font-weight: 600;
            color: var(--ppt-text-2);
            line-height: 1.4;
        }

        .ai-lab-vertical-spacer-block {
            height: 280px;
        }

        .ai-lab-bottom-title-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .ai-lab-main-display-title {
            font-family: var(--ppt-font-display);
            font-size: 64px;
            font-weight: 800;
            color: var(--ppt-text-1);
            line-height: 1.1;
            margin: 0;
            max-width: 900px;
        }

        .ai-lab-subtitle-highlight-box {
            background-color: var(--ppt-surface-2);
            padding-top: 16px;
            padding-bottom: 16px;
            padding-left: 24px;
            padding-right: 24px;
            border-left: 6px solid var(--ppt-accent);
            width: fit-content;
            max-width: 850px;
        }

        .ai-lab-subtitle-description-text {
            font-family: var(--ppt-font-body);
            font-size: 24px;
            font-weight: 500;
            color: var(--ppt-text-2);
            line-height: 1.4;
            margin: 0;
        }
    
html { overflow: hidden; }
</style>
<meta name="PageAspectRatio" content="16:9"/><meta name="PageSize" content="1280_720"/></head>
<body>
    <div class="ai-lab-slide-root" style="position: relative; overflow: hidden; width: 1280px; height: 720px;">
        <!-- Background Image Layer -->
        <div class="ai-lab-background-image-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 720px;">
            <img src="https://skyagent-artifacts.skywork.ai/image/5940376570349285532/2095592379558969344/2095592379558969345.png" class="ai-lab-background-image-item" alt="AI Research Background"/>
        </div>

        <!-- Fade Overlay for Readability -->
        <div class="ai-lab-overlay-gradient-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 720px;"></div>

        <!-- Foreground Content Layer -->
        <div class="ai-lab-content-layout-wrapper">
            <!-- Top Metadata -->
            <div class="ai-lab-top-metadata-container">
                <div class="ai-lab-metadata-label-item">Інформатика, 11 клас</div>
                <div class="ai-lab-metadata-sublabel-item">Модуль: Штучний інтелект</div>
            </div>

            <!-- Spacer to push content to bottom 40% -->
            <div class="ai-lab-vertical-spacer-block"></div>

            <!-- Main Title Area -->
            <div class="ai-lab-bottom-title-container">
                <h1 class="ai-lab-main-display-title">
                    Створюємо власного AI-помічника
                </h1>
                
                <div class="ai-lab-subtitle-highlight-box">
                    <p class="ai-lab-subtitle-description-text">
                        Яку реальну проблему в навчанні чи шкільному житті може полегшити AI-помічник? Проєктуємо, налаштовуємо та тестуємо.
                    </p>
                </div>
            </div>
        </div>
    </div>

</body></html>
