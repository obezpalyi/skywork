- page_num: 1
  heading: Створюємо власного AI-помічника
  type: title
  des: 'Визначення мети проєкту: вибір реальної проблеми в навчанні, розробка системної інструкції та встановлення меж для безпечного AI-помічника.'
- page_num: 2
  heading: Від технології до проблеми
  type: content
  des: Формулювання ідеї помічника через визначення користувача, конкретної проблеми та очікуваного результату замість абстрактного використання ШІ.
- page_num: 3
  heading: Приклади помічників
  type: content
  des: 'Огляд варіантів AI-помічників: від тренерів до контрольних до генераторів ідей, із обов’язковим визначенням їхніх функцій та обмежень.'
- page_num: 4
  heading: Картка проєкту
  type: content
  des: 'Заповнення основних компонентів проєкту: назва, користувач, функції, заборонені дії, правила приватності та критерії успішної роботи помічника.'
- page_num: 5
  heading: Що таке системна інструкція
  type: content
  des: Визначення ролі, мети, стилю допомоги та алгоритмів поведінки ШІ для створення конкретної та придатної для тестування інструкції.
- page_num: 6
  heading: Конструктор інструкції
  type: content
  des: 'Практична структура написання промпту: від визначення ролі та мети до правил обробки непевних ситуацій і захисту приватних даних.'
- page_num: 7
  heading: Безпека і межі компетенції
  type: content
  des: Встановлення обмежень щодо збору персональних даних, виконання завдань замість учня та надання порад у сферах високого ризику.
- page_num: 8
  heading: Три тестові сценарії
  type: content
  des: Перевірка помічника через типовий, неоднозначний та небезпечний запити для оцінки його функціональності, здатності уточнювати та безпечно відмовляти.
- page_num: 9
  heading: Оцінюємо й удосконалюємо
  type: content
  des: Аналіз роботи помічника за критеріями корисності та безпеки, а також коригування системної інструкції у разі виявлення помилок.
- page_num: 10
  heading: Захист мініпроєкту
  type: content
  des: Презентація результатів роботи, підбиття підсумків через Exit ticket та оцінювання проєкту за 12-бальною шкалою.
