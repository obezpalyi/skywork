<!DOCTYPE html><html lang="uk"><head>
    <meta charset="UTF-8"/>
    <title>Управління вимогами та змінами в SDLC із застосуванням штучного інтелекту</title>
    <script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"/><style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap');

        :root {
            --ppt-bg: #FCFCFD;
            --ppt-bg-soft: #F1F5F9;
            --ppt-surface: #FFFFFF;
            --ppt-surface-2: #F8FAFC;
            --ppt-border: #E2E8F0;
            --ppt-text-1: #0F172A;
            --ppt-text-2: #475569;
            --ppt-text-3: #94A3B8;
            --ppt-accent: #2563EB;
            --ppt-accent-2: #06B6D4;
            --ppt-chart-1: #2563EB;
            --ppt-chart-2: #06B6D4;
            --ppt-chart-3: #6366F1;
            --ppt-chart-4: #F59E0B;
            --ppt-good: #10B981;
            --ppt-warn: #F59E0B;
            --ppt-bad: #EF4444;
            --ppt-radius-sm: 2px;
            --ppt-radius-md: 6px;
            --ppt-radius-lg: 10px;
            --ppt-shadow-soft: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --ppt-shadow-strong: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --ppt-font-display: "Plus Jakarta Sans", sans-serif;
            --ppt-font-body: "Inter", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {width: 1280px; height: 720px; overflow: hidden;   
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        .sdlc-course-cover-canvas {
            width: 1280px; height: 720px;
            background-color: var(--ppt-bg);
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            
            position: relative;
        }

        .sdlc-course-background-image-container {
            grid-area: 1/1;
            z-index: 0; height: 720px;
            width: 100%;
        }

        .sdlc-course-hero-background-image {
            width: 100%; height: 720px;
            object-fit: cover;
            display: block;
        }

        .sdlc-course-content-layer-wrapper {
            grid-area: 1/1;
            z-index: 1;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(90deg, 
                rgba(252, 252, 253, 1) 0%, 
                rgba(252, 252, 253, 0.98) 35%, 
                rgba(252, 252, 253, 0.85) 55%, 
                rgba(252, 252, 253, 0) 100%);
        }

        .sdlc-course-dot-grid-decoration {
            grid-area: 1/1;
            z-index: 2;
            pointer-events: none;
            width: 50%;
            height: 100%;
            justify-self: end;
            background-image: radial-gradient(var(--ppt-border) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            opacity: 0.4;
            mask-image: linear-gradient(to left, black, transparent);
        }

        .sdlc-course-title-section-container {
            width: 70%;
            margin-top: 40px;
        }

        .sdlc-course-main-title-text {
            font-family: var(--ppt-font-display);
            font-size: 60px;
            font-weight: 800;
            line-height: 1.1;
            color: var(--ppt-text-1);
            margin-bottom: 24px;
            max-width: 90%;
        }

        .sdlc-course-accent-divider-line {
            width: 80px;
            height: 4px;
            background-color: var(--ppt-accent);
            margin-bottom: 24px;
        }

        .sdlc-course-subtitle-text-content {
            font-family: var(--ppt-font-display);
            font-size: 24px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--ppt-text-2);
            max-width: 80%;
        }

        .sdlc-course-metadata-info-footer {
            display: flex;
            gap: 48px;
            margin-bottom: 20px;
        }

        .sdlc-course-metadata-item-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sdlc-course-metadata-label-tag {
            font-family: var(--ppt-font-body);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ppt-text-3);
        }

        .sdlc-course-metadata-value-text {
            font-family: var(--ppt-font-body);
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--ppt-text-1);
        }
    
html { overflow: hidden; }
</style>
<meta name="PageAspectRatio" content="16:9"/><meta name="PageSize" content="1280_720"/></head>
<body>

    <div class="sdlc-course-cover-canvas">
        <!-- Background Image Layer -->
        <div class="sdlc-course-background-image-container">
            <img src="https://skyagent-artifacts.skywork.ai/image/5940376570349285532/2094331578005917696/2094331578005917697.png" alt="SDLC AI Workflow" class="sdlc-course-hero-background-image"/>
        </div>

        <!-- Decorative Dot Grid -->
        <div class="sdlc-course-dot-grid-decoration"></div>

        <!-- Content Layer -->
        <div class="sdlc-course-content-layer-wrapper">
            <!-- Title Area -->
            <div class="sdlc-course-title-section-container">
                <h1 class="sdlc-course-main-title-text">
                    Управління вимогами та змінами в SDLC із застосуванням штучного інтелекту
                </h1>
                <div class="sdlc-course-accent-divider-line"></div>
                <p class="sdlc-course-subtitle-text-content">
                    Навчальна програма для Business Analyst, QA та DevOps спеціалістів
                </p>
            </div>

            <!-- Footer Metadata Area -->
            <div class="sdlc-course-metadata-info-footer">
                <div class="sdlc-course-metadata-item-box">
                    <span class="sdlc-course-metadata-label-tag">Інструментарій</span>
                    <span class="sdlc-course-metadata-value-text">Xplore AI-Workflows</span>
                </div>
                <div class="sdlc-course-metadata-item-box">
                    <span class="sdlc-course-metadata-label-tag">Тривалість</span>
                    <span class="sdlc-course-metadata-value-text">27 академічних годин</span>
                </div>
                <div class="sdlc-course-metadata-item-box">
                    <span class="sdlc-course-metadata-label-tag">Рівень</span>
                    <span class="sdlc-course-metadata-value-text">Professional</span>
                </div>
            </div>
        </div>
    </div>


</body></html>
